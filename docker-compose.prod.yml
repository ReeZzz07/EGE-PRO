# Прод-конфигурация для деплоя на реальный сервер (см. SETUP.md → "Прод-деплой") — сознательно
# ОТДЕЛЬНЫЙ файл, а не override над docker-compose.yml: у dev-версии Postgres (5544) и web (3100)
# опубликованы на хост намеренно (тесты с хоста, открыть браузером без прокси) — Compose при
# слиянии `ports:` из нескольких файлов их не заменяет, а добавляет, так что override не смог бы
# надёжно СНЯТЬ публикацию порта. Отдельный файл — единственный способ гарантировать, что в проде
# Postgres/api/postgrest не торчат в интернет: наружу смотрит только Caddy (80/443).
#
# Запуск на сервере: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — заполни .env}
      POSTGRES_DB: postgres
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD не задан — заполни .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/pg-init/entrypoint.sh:/docker-entrypoint-initdb.d/entrypoint.sh:ro
      - ./docker/pg-init/0000_bootstrap.sql:/pg-init-extra/0000_bootstrap.sql:ro
      - ./docker/pg-init/9999_grants.sql:/pg-init-extra/9999_grants.sql:ro
      - ./supabase/migrations:/pg-init-migrations:ro
    # Никакого ports: — доступ только из внутренней docker-сети (api/postgrest). scripts/backup.sh
    # заходит через `docker compose exec`, не через host-порт — без публикации порта не сломается.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD не задан — заполни .env}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан — заполни .env}
      PGRST_JWT_ROLE_CLAIM_KEY: $.role
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_MAX_ROWS: 20000

  api:
    build: ./docker/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — заполни .env}@postgres:5432/postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан — заполни .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      STORAGE_ROOT: /data/storage
      # Настоящий https-домен платформы — без него CORS отклонит все запросы фронтенда с прод-домена.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN не задан — укажи https://твой-домен в .env}
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: node:20-slim
    restart: unless-stopped
    working_dir: /app
    # В отличие от dev-файла — здесь сборка (npm run build) идёт ПРЯМО В КОНТЕЙНЕРЕ, не на хосте:
    # причина держать сборку на хосте в dev — это Windows + Docker Desktop, где bind-mount на
    # порядок медленнее нативной FS (см. docker-compose.yml/SETUP.md); на Linux-сервере такого
    # штрафа нет, а сборка в контейнере проще в эксплуатации — не нужен Node.js на самом хосте,
    # весь деплой — это git pull + один docker compose. VITE_SUPABASE_URL здесь ОБЯЗАН быть
    # настоящим https-доменом — Vite вклеивает его в бандл именно на этом шаге (see vite.config.js).
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL не задан — укажи https://твой-домен в .env}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-local-anon-key-unused}
      VITE_SITE_URL: ${VITE_SITE_URL:-${VITE_SUPABASE_URL}}
      BACKEND_PROXY_HOST: api
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    # Никакого ports: — вход только через caddy ниже, наружу web не публикуется вовсе.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgrest:
        condition: service_started
      api:
        condition: service_healthy

  # Реверс-прокси + автоматический TLS (Let's Encrypt) — единственный сервис, публикующий порты
  # наружу. Конфиг — docker/Caddyfile (домен читается из .env через переменную окружения ниже).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST не задан — укажи голый домен без схемы (например ege-tutor.ru) в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage_data:
  web_node_modules:
  caddy_data:
  caddy_config:
